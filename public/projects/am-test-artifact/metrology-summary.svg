<text x="78" y="806" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Interpretation boundary</text>
<text x="300" y="806" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5D6B82">One physical artifact; results diagnose this build and inspection chain, not statistical machine capability.</text>
<text x="78" y="837" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5D6B82">Source: 2018 project measurement record. Statistics are reproducible from the committed CSV files.</text>
