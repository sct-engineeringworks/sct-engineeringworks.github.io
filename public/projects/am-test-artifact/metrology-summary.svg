<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">2018 physical artifact metrology snapshot</title>
<desc id="desc">Summary of measured form, dimensional, and orientation deviations in millimetres from one manufactured additive manufacturing test artifact.</desc>
